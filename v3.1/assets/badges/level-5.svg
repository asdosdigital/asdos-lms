<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <filter id="shadow-l5" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#831843" flood-opacity="0.2"/>
    </filter>
    <filter id="ribbon-shadow-l5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="bg-grad-l5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>

    <linearGradient id="rim-grad-l5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>

    <linearGradient id="gold-grad-l5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="ribbon-grad-l5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="50%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow-l5)">
    <!-- Outer Shield / Medallion -->
    <path d="M90 12 C124 12 152 24 152 58 C152 104 116 138 90 148 C64 138 28 104 28 58 C28 24 56 12 90 12 Z" 
          fill="url(#bg-grad-l5)" stroke="url(#rim-grad-l5)" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Inner Dotted Ring -->
    <path d="M90 20 C118 20 143 30 143 60 C143 98 112 128 90 137 C68 128 37 98 37 60 C37 30 62 20 90 20 Z" 
          fill="none" stroke="#F472B6" stroke-width="1.6" stroke-dasharray="3.5 3.5"/>

    <!-- Sparkles -->
    <path d="M128 36 L130 41 L135 43 L130 45 L128 50 L126 45 L121 43 L126 41 Z" fill="#FFB300"/>
    <path d="M52 46 L53 50 L57 51 L53 52 L52 56 L51 52 L47 51 L51 50 Z" fill="#F472B6"/>

    <!-- Central Illustration: Studio Microphone & Sound Waves -->
    <g transform="translate(90, 75)">
      <!-- Sound Wave Radiations -->
      <path d="M-28 -4 C-34 -14 -34 14 -28 24" fill="none" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M28 -4 C34 -14 34 14 28 24" fill="none" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Microphone Body -->
      <rect x="-10" y="-18" width="20" height="30" rx="10" fill="#374151" stroke="#111827" stroke-width="1.5"/>
      <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#9CA3AF" stroke-width="1.2"/>
      <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#9CA3AF" stroke-width="1.2"/>
      
      <!-- Mic Cradle -->
      <path d="M-15 -4 C-15 16 15 16 15 -4" fill="none" stroke="#DB2777" stroke-width="3" stroke-linecap="round"/>
      <!-- Stand Stem & Base -->
      <line x1="0" y1="16" x2="0" y2="28" stroke="#DB2777" stroke-width="3"/>
      <line x1="-12" y1="28" x2="12" y2="28" stroke="#DB2777" stroke-width="3.5" stroke-linecap="round"/>

      <circle cx="16" cy="-14" r="3" fill="#FFB300"/>
    </g>

    <!-- Top Badge Level Pill with 5 Stars -->
    <g transform="translate(90, 24)">
      <rect x="-42" y="-12" width="84" height="24" rx="12" fill="url(#gold-grad-l5)" stroke="#FFFFFF" stroke-width="1.8"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#422006" text-anchor="middle" letter-spacing="0.5">LEVEL 5</text>
    </g>

    <!-- Bottom Ribbon -->
    <g filter="url(#ribbon-shadow-l5)">
      <polygon points="18 152 12 136 28 138" fill="#500724"/>
      <polygon points="162 152 168 136 152 138" fill="#500724"/>
      <path d="M20 134 Q90 140 160 134 L156 154 Q90 160 24 154 Z" fill="url(#ribbon-grad-l5)" stroke="#F472B6" stroke-width="1.2"/>
      <text x="90" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AUDIO &amp; NARASI</text>
    </g>
  </g>
</svg>
