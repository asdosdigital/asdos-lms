<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <!-- Filter Glow & Drop Shadow -->
    <filter id="shadow-l1" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E3A2F" flood-opacity="0.18"/>
    </filter>
    <filter id="ribbon-shadow-l1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.22"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2FBF4"/>
      <stop offset="100%" stop-color="#E2F5E6"/>
    </linearGradient>

    <linearGradient id="rim-grad-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88D49E"/>
      <stop offset="50%" stop-color="#2E7D4F"/>
      <stop offset="100%" stop-color="#1B5032"/>
    </linearGradient>

    <linearGradient id="sprout-grad-l1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D4F"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>

    <linearGradient id="gold-grad-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="ribbon-grad-l1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E5C38"/>
      <stop offset="50%" stop-color="#2E7D4F"/>
      <stop offset="100%" stop-color="#1E5C38"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow-l1)">
    <!-- Outer Shield / Medallion -->
    <path d="M90 12 C124 12 152 24 152 58 C152 104 116 138 90 148 C64 138 28 104 28 58 C28 24 56 12 90 12 Z" 
          fill="url(#bg-grad-l1)" stroke="url(#rim-grad-l1)" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Inner Dotted Ring/Line -->
    <path d="M90 20 C118 20 143 30 143 60 C143 98 112 128 90 137 C68 128 37 98 37 60 C37 30 62 20 90 20 Z" 
          fill="none" stroke="#7CB38A" stroke-width="1.6" stroke-dasharray="3.5 3.5"/>

    <!-- Sparkles -->
    <path d="M126 36 L128 41 L133 43 L128 45 L126 50 L124 45 L119 43 L124 41 Z" fill="#FFB300"/>
    <path d="M54 44 L55 48 L59 49 L55 50 L54 54 L53 50 L49 49 L53 48 Z" fill="#81C784"/>

    <!-- Central Icon: Sprout + Glowing Seedling of Creativity -->
    <g transform="translate(90, 72)">
      <!-- Earth pot / furrow -->
      <path d="M-22 28 C-18 24 18 24 22 28 C18 34 -18 34 -22 28 Z" fill="#A47E5B" opacity="0.4"/>
      
      <!-- Sprout stem -->
      <path d="M0 26 C-2 10 -4 0 0 -12" fill="none" stroke="#2E7D4F" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Left Leaf -->
      <path d="M-1 4 C-14 2 -22 -10 -15 -18 C-6 -22 -1 -12 -1 4 Z" fill="url(#sprout-grad-l1)"/>
      <path d="M-2 4 C-8 -4 -12 -9 -14 -14" fill="none" stroke="#A5D6A7" stroke-width="1.4" stroke-linecap="round"/>
      
      <!-- Right Leaf (Young shoot) -->
      <path d="M0 -4 C12 -8 18 -20 11 -26 C3 -28 0 -16 0 -4 Z" fill="url(#sprout-grad-l1)"/>
      <path d="M0 -5 C5 -12 8 -17 9 -21" fill="none" stroke="#C8E6C9" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Creative Light Sparkle on shoot tip -->
      <circle cx="11" cy="-26" r="3.5" fill="#FFE082"/>
      <circle cx="11" cy="-26" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Top Badge Level Pill -->
    <g transform="translate(90, 24)">
      <rect x="-34" y="-12" width="68" height="24" rx="12" fill="url(#gold-grad-l1)" stroke="#FFFFFF" stroke-width="1.8"/>
      <!-- Star -->
      <polygon points="-20,-1 -18,-6 -16,-1 -11,-1 -15,2 -13,7 -18,4 -23,7 -21,2 -25,-1" fill="#FFFFFF" transform="scale(0.8) translate(-4, 0)"/>
      <text x="5" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#422006" text-anchor="middle" letter-spacing="0.5">LEVEL 1</text>
    </g>

    <!-- Bottom Ribbon -->
    <g filter="url(#ribbon-shadow-l1)">
      <!-- Ribbon Tails -->
      <polygon points="20 152 14 136 30 138" fill="#143D25"/>
      <polygon points="160 152 166 136 150 138" fill="#143D25"/>
      
      <!-- Ribbon Center Plaque -->
      <path d="M22 134 Q90 140 158 134 L154 154 Q90 160 26 154 Z" fill="url(#ribbon-grad-l1)" stroke="#88D49E" stroke-width="1.2"/>
      
      <!-- Ribbon Text -->
      <text x="90" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">LANGKAH PERTAMA</text>
    </g>
  </g>
</svg>
