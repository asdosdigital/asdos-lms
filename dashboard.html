<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF9F0">
  <title>Ruang Belajar Siswa - Asdos Digital Academy</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="asdos-square.png">
  <link rel="apple-touch-icon" href="asdos-square.png">
  <link rel="stylesheet" href="lms-core.css">
  <style>
    /* =====================================================================
       PALET v3 "Dapur Hangat": krem hangat + teal tenang + hijau daun
       Semua teks dijaga kontras tinggi (min. 4.5:1) agar nyaman dibaca
       ===================================================================== */
    :root {
      --bg: #FFF9F0;
      --card: #FFFFFF;
      --card-bg: #FFFFFF;
      --ink: #2A2420;
      --muted: #5E544C;
      --line: #E8DCCB;
      --brand: #1F6B7A;
      --brand-dark: #164F5B;
      --go: #2E7D4F;
      --go-dark: #226139;
      --leaf: #E6F4E4;
      --leaf-line: #7DBB8A;
      --peach: #FFEBD6;
      --peach-line: #F0B98A;
      --sun: #FFF3BF;
      --danger-bg: #FFF0EC;
      --danger-ink: #8A2A12;
      --shadow: 0 4px 24px rgba(80, 55, 30, 0.07);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    .wrap { max-width: 1060px; margin: auto; padding: 0 20px; }

    /* Top Nav */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 249, 240, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1.5px solid var(--line);
    }
    .top-nav-in {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 850;
      font-size: 16px;
      color: var(--brand-dark);
    }
    .brand-link img {
      width: 34px;
      height: 34px;
      border-radius: 10px;
    }
    .top-nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-tag {
      background: #ffffff;
      border: 1.5px solid var(--line);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 800;
      color: var(--brand-dark);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-exit {
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      padding: 6px 12px;
      border-radius: 10px;
      transition: .15s;
    }
    .btn-exit:hover {
      background: var(--danger-bg);
      border-color: #E9B3A4;
      color: var(--danger-ink);
    }

    /* Modal Rincian 7 Hari */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 36, 32, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      background: #ffffff;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      max-width: 620px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(42, 36, 32, 0.2);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1.5px solid var(--line);
      padding-bottom: 14px;
    }
    .modal-head h3 {
      margin: 0;
      font-size: 20px;
      color: var(--brand-dark);
      font-weight: 850;
    }
    .modal-close {
      border: 2px solid var(--line);
      background: #FBF6EC;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--ink);
      transition: .15s;
    }
    .modal-close:hover {
      background: var(--peach);
      border-color: var(--peach-line);
    }
    .modal-lesson-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid var(--line);
      border-radius: 14px;
      margin-bottom: 10px;
      text-decoration: none;
      color: var(--ink);
      background: #FBF6EC;
      transition: .15s;
    }
    .modal-lesson-item:hover {
      background: var(--leaf);
      border-color: var(--leaf-line);
      transform: translateY(-1px);
    }
    .modal-lesson-item.done {
      background: #ffffff;
      border-color: var(--leaf-line);
    }

    /* Video Player Modal */
    .video-modal-frame {
      width: 100%;
      aspect-ratio: 16/9;
      border: 0;
      border-radius: 14px;
      background: #000;
    }

    /* Auth Screen */
    .auth-box-wrap {
      max-width: 460px;
      margin: 60px auto;
      background: #ffffff;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      padding: 36px 30px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .auth-box-wrap h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 850;
      letter-spacing: -.4px;
      color: var(--brand-dark);
    }
    .auth-box-wrap p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .auth-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--line);
      border-radius: 14px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
      background: #FBF6EC;
      color: var(--ink);
    }
    .auth-input:focus {
      border-color: var(--brand);
      background: #ffffff;
    }
    .btn-auth-submit {
      width: 100%;
      background: var(--brand);
      color: white;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--brand-dark);
      transition: .15s;
    }
    .btn-auth-submit:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--brand-dark);
    }
    .btn-auth-submit:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .auth-badge-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .auth-pill {
      font-size: 11px;
      font-weight: 750;
      color: var(--brand-dark);
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .auth-otp-input {
      letter-spacing: 8px;
      font-size: 26px;
      text-align: center;
      font-weight: 850;
      max-width: 260px;
      margin: 0 auto 16px;
      display: block;
    }
    .trust-device-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: var(--ink);
      font-weight: 650;
      margin-bottom: 18px;
      cursor: pointer;
      user-select: none;
    }
    .trust-device-label input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--brand);
      cursor: pointer;
    }
    .auth-links-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      font-size: 13px;
    }
    .btn-text-link {
      background: none;
      border: none;
      padding: 0;
      color: var(--brand);
      font-weight: 750;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
    }
    .btn-text-link:disabled {
      color: var(--muted);
      cursor: not-allowed;
      text-decoration: none;
    }
    .auth-device-alert {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.4;
    }
    .auth-notice {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 14px;
      text-align: left;
      line-height: 1.4;
    }
    .auth-notice.danger {
      background: var(--danger-bg);
      color: var(--danger-ink);
      border: 1px solid rgba(138,42,18,0.2);
    }
    .auth-notice.info {
      background: var(--leaf);
      color: var(--go-dark);
      border: 1px solid var(--leaf-line);
    }
    .auth-footer-help {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1.5px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      text-align: left;
      line-height: 1.6;
    }
    .auth-footer-help p {
      margin: 0 0 8px;
    }
    .auth-footer-help a {
      color: var(--brand);
      font-weight: 750;
      text-decoration: underline;
    }

    /* Floating Bottom Navigation Dock (Universal Desktop & Mobile) */
    .mobile-bottom-nav {
      display: flex !important;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 32px rgba(42, 36, 32, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
      border-radius: 999px;
      padding: 6px;
      align-items: center;
      justify-content: space-around;
      gap: 6px;
      box-sizing: border-box;
    }
    .mobile-bottom-nav.d-none {
      display: none !important;
    }
    .mobile-bottom-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-decoration: none;
    }
    .mobile-bottom-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--muted);
      stroke-width: 2.2;
      fill: none;
      transition: stroke 0.2s, transform 0.2s;
    }
    .mobile-bottom-btn:hover:not(.active) {
      background: #FBF6EC;
      color: var(--ink);
    }
    .mobile-bottom-btn:hover:not(.active) svg {
      stroke: var(--ink);
    }
    .mobile-bottom-btn.active {
      background: var(--leaf);
      color: var(--brand-dark);
      font-weight: 850;
    }
    .mobile-bottom-btn.active svg {
      stroke: var(--brand);
      transform: translateY(-1px);
    }

    /* Swipe Indicator Hint for Mobile */
    .swipe-hint-pill {
      display: none;
    }
    @media (max-width: 768px) {
      .wrap {
        padding: 0 14px;
      }
      .top-nav-in {
        height: 60px;
        gap: 8px;
      }
      .brand-link {
        font-size: 14px;
        gap: 8px;
      }
      .brand-link img {
        width: 28px;
        height: 28px;
      }
      .user-tag {
        padding: 4px 10px;
        font-size: 12px;
      }
      .btn-exit {
        padding: 4px 8px;
        font-size: 12px;
      }

      /* Single column student profile card */
      .student-profile-card {
        grid-template-columns: 1fr !important;
        padding: 18px 16px !important;
        gap: 16px !important;
        margin: 14px 0 18px !important;
      }
      .profile-meta h2 {
        font-size: 22px !important;
        margin: 4px 0 6px !important;
      }
      .profile-meta p {
        font-size: 14px !important;
        margin-bottom: 14px !important;
      }
      .profile-level-badge {
        border-radius: 14px !important;
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 12px !important;
        width: 100% !important;
        padding: 10px 14px !important;
        box-sizing: border-box !important;
      }
      .level-badge-icon {
        width: 48px !important;
        height: 48px !important;
      }
      .profile-level-texts span {
        font-size: 11px !important;
        font-weight: 750 !important;
        color: #8C5311 !important;
      }
      .profile-level-texts strong {
        font-size: 14px !important;
        font-weight: 850 !important;
        color: #422006 !important;
      }
      .profile-stats-box {
        width: 100% !important;
        padding: 16px 14px !important;
        box-sizing: border-box !important;
      }
      .profile-stats-box .stat-val {
        font-size: 32px !important;
      }
      .profile-quick-links {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 8px !important;
        width: 100% !important;
        margin-top: 14px !important;
      }
      .quick-link-pill {
        width: 100% !important;
        min-height: 44px !important;
        padding: 10px 14px !important;
        font-size: 13.5px !important;
        font-weight: 800 !important;
        box-sizing: border-box !important;
        display: flex !important;
        align-items: center !important;
        justify-content: flex-start !important;
      }

      /* Single column Continue card */
      .continue-highlight-card {
        flex-direction: column !important;
        align-items: stretch !important;
        padding: 18px 16px !important;
        gap: 14px !important;
        margin-bottom: 22px !important;
      }
      .ch-info {
        width: 100% !important;
      }
      .ch-info h3 {
        font-size: 19px !important;
        line-height: 1.35 !important;
        word-break: normal !important;
        margin: 4px 0 6px !important;
      }
      .ch-info p {
        font-size: 14px !important;
      }
      .ch-btn {
        width: 100% !important;
        text-align: center !important;
        justify-content: center !important;
        display: flex !important;
        min-height: 48px !important;
        font-size: 15px !important;
        font-weight: 850 !important;
        box-sizing: border-box !important;
      }

      /* Tab bar atas dinonaktifkan karena sudah ada di navigasi bawah */
      .dash-tabs-nav {
        display: none !important;
      }

      .swipe-hint-pill {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 750;
        color: var(--muted);
        margin: 8px auto 14px;
        background: #F5EBE0;
        padding: 5px 12px;
        border-radius: 999px;
        width: fit-content;
      }
      .swipe-hint-pill svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 2.2;
        fill: none;
      }

      .gallery-grid {
        grid-template-columns: 1fr !important;
        gap: 14px !important;
      }
      .tools-grid {
        grid-template-columns: 1fr !important;
      }

      .mobile-bottom-nav {
        bottom: 12px;
        padding: 5px 6px;
        gap: 4px;
        width: calc(100% - 24px);
      }
      .mobile-bottom-btn {
        padding: 6px 8px;
        font-size: 11px;
      }
      .mobile-bottom-btn svg {
        width: 19px;
        height: 19px;
      }
    }

    /* =====================================================================
       WHATSAPP MENTORS & COMPACT TOOLS CARDS (GAYA LMS ASDOS HANGAT & RAMPING)
       ===================================================================== */
    .mentors-compact-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .mentor-compact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      background: #FAF7F0;
      border: 1.5px solid #E8DCCB;
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      transition: all 0.15s ease;
      min-height: 52px;
    }
    .mentor-compact-item:hover {
      background: #FFFFFF;
      border-color: #25D366;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.12);
      transform: translateY(-1.5px);
    }
    .m-compact-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #E8F8EE;
      color: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .m-compact-info {
      flex: 1;
      min-width: 0;
    }
    .m-compact-info strong {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--brand-dark);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .m-compact-info small {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .m-compact-arrow {
      font-size: 15px;
      color: #25D366;
      font-weight: 800;
      transition: transform 0.15s ease;
    }
    .mentor-compact-item:hover .m-compact-arrow {
      transform: translateX(3px);
    }

    /* Asdos Compact Tool & Link Cards */
    .asdos-compact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .asdos-compact-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #FFFFFF;
      border: 1.5px solid #EAE2D5;
      border-radius: 12px;
      padding: 10px 14px;
      text-decoration: none;
      color: var(--ink);
      min-height: 56px;
      box-shadow: 0 2px 6px rgba(42, 36, 32, 0.02);
      transition: all 0.15s ease;
    }
    .asdos-compact-card:hover {
      border-color: var(--brand);
      background: #FAF7F0;
      box-shadow: 0 4px 14px rgba(31, 107, 122, 0.08);
      transform: translateY(-1.5px);
    }
    .acc-main {
      flex: 1;
      min-width: 0;
    }
    .acc-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .acc-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--brand-dark);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .acc-badge {
      font-size: 10.5px;
      font-weight: 750;
      padding: 1px 6px;
      border-radius: 6px;
      background: #FAF3E8;
      color: var(--muted);
      border: 1px solid #EADDC9;
      white-space: nowrap;
    }
    .acc-desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 270px;
    }
    .acc-arrow {
      font-size: 15px;
      color: var(--brand);
      font-weight: 800;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }
    .asdos-compact-card:hover .acc-arrow {
      transform: translateX(3px);
    }

    @media (max-width: 560px) {
      .asdos-compact-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .mentors-compact-group {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .acc-title {
        max-width: 190px;
      }
      .acc-desc {
        max-width: 230px;
      }
    }

    /* Onboarding Username & Profile Customization */
    .onboarding-pill {
      display: inline-block;
      padding: 3px 10px;
      background: #FAF3E8;
      color: var(--brand-dark);
      border: 1px solid #E8DCCB;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .onboarding-privacy-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 13px;
      background: #F4F9F5;
      border: 1.2px solid #D5E7DA;
      border-radius: 12px;
      font-size: 12px;
      color: #2D5A42;
      line-height: 1.45;
      text-align: left;
      margin-top: 12px;
    }
    .onboarding-privacy-box svg {
      flex-shrink: 0;
      margin-top: 2px;
      color: #25D366;
    }
    .btn-name-edit {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      background: #FAF7F0;
      border: 1.2px solid #E8DCCB;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 750;
      color: var(--brand);
      cursor: pointer;
      transition: all 0.15s ease;
      vertical-align: middle;
    }
    .btn-name-edit:hover {

<script>
// ==========================================================================
// STATE TAB & SWIPE GESTURES
// ==========================================================================
let currentTabIndex = 0;
let swipeStartX = 0;
let swipeStartY = 0;
let swipeStartTime = 0;
let isHorizontalGesture = false;

function goToDashboardTab(index, smooth = true) {
  if (index < 0) index = 0;
  if (index > 2) index = 2;
  currentTabIndex = index;

  const track = document.getElementById('dashSwipeTrack');
  if (track) {
    track.style.transition = smooth ? 'transform 0.32s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
    track.style.transform = `translateX(-${index * (100 / 3)}%)`;
  }

  // Sync tombol aktif di Desktop tab dan Mobile bottom nav
  document.querySelectorAll('.dash-tab-btn, .mobile-bottom-btn').forEach(btn => {
    const btnIdx = parseInt(btn.dataset.tabIndex, 10);
    btn.classList.toggle('active', btnIdx === index);
  });
}

function initSwipeGestures() {
  const viewport = document.getElementById('dashSwipeViewport');
  if (!viewport) return;

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
    swipeStartTime = Date.now();
    isHorizontalGesture = false;
  }, { passive: true });

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 1) return;
    const diffX = e.touches[0].clientX - swipeStartX;
    const diffY = e.touches[0].clientY - swipeStartY;

    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
      isHorizontalGesture = true;
    }
  }, { passive: true });

  viewport.addEventListener('touchend', (e) => {
    if (!isHorizontalGesture) return;
    const diffX = e.changedTouches[0].clientX - swipeStartX;
    const duration = Date.now() - swipeStartTime;

    const isFlick = duration < 320 && Math.abs(diffX) > 35;
    const isDrag = Math.abs(diffX) > 65;

    if (isFlick || isDrag) {
      if (diffX < 0) {
        goToDashboardTab(currentTabIndex + 1);
      } else {
        goToDashboardTab(currentTabIndex - 1);
      }
    }
    isHorizontalGesture = false;
  }, { passive: true });
}

// Audio synthesizer for feedback
let audioCtx = null;
function playSuccessTone() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx && AudioContext) audioCtx = new AudioContext();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (!audioCtx) return;

    const notes = [659.25, 830.61, 987.77];
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.08 + 0.28);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + idx * 0.08);
      osc.stop(audioCtx.currentTime + idx * 0.08 + 0.3);
    });
  } catch(e) {}
}

function getCardStatus(card, overall) {
  // 1. Program Inti 7 Hari
  if (card.type === 'core_7day') {
    if (overall && overall.completedDays >= 7) {
      return { status: 'completed', label: 'Selesai', cssClass: 'status-completed' };
    }
    if (overall && overall.completedDays > 0) {
      return { status: 'progress', label: `${overall.completedDays}/7 Selesai`, cssClass: 'status-progress' };
    }
    return { status: 'unstarted', label: 'Belum Selesai', cssClass: 'status-unstarted' };
  }

  // 2. Modul Interaktif & Modul Mandiri
  const isCompleted = localStorage.getItem('asdos_module_completed_' + card.id) === 'true'
    || (card.id === 'card-flow-generate' && localStorage.getItem('asdos_module_flow_completed') === '1')
    || (card.id === 'card-affiliate-ugc' && localStorage.getItem('asdos_module_affiliate_completed') === '1')
    || localStorage.getItem('asdos_video_' + card.id + '_watched') === '1';

  if (isCompleted) {
    return { status: 'completed', label: 'Selesai', cssClass: 'status-completed' };
  }

  // Cek progres berjalan
  const inProgress = (card.id === 'card-flow-generate' && localStorage.getItem('asdos_flow_active_step'))
    || (card.id === 'card-affiliate-ugc' && localStorage.getItem('asdos_affiliate_current_card'))
    || localStorage.getItem('asdos_module_progress_' + card.id);

  if (inProgress) {
    return { status: 'progress', label: 'Sedang Belajar', cssClass: 'status-progress' };
  }

  return { status: 'unstarted', label: 'Belum Selesai', cssClass: 'status-unstarted' };
}

function renderCategoriesHtml(categories, overall) {
  return categories.map(cat => {
    if (cat.isHidden) return '';
    const visibleCards = (cat.cards || []).filter(card => !card.isHidden);
    if (visibleCards.length === 0) return '';

    const cardsHtml = visibleCards.map(card => {
      let targetHref = '#';
      let clickAttr = '';
      let badgeLabel = card.badge || 'Modul';
      const statusInfo = getCardStatus(card, overall);
      let footStatus = '';

      if (card.type === 'core_7day') {
        targetHref = '#';
        clickAttr = `onclick="openModal7Day(); return false;"`;
        badgeLabel = `Program 7 Hari &bull; ${overall.completedDays}/7 Selesai`;
        if (statusInfo.status === 'completed') {
          footStatus = `<span>${overall.percent}% Tuntas</span> <span style="color:var(--go);font-weight:850">Lihat Bab &rarr;</span>`;
        } else if (statusInfo.status === 'progress') {
          footStatus = `<span>${overall.percent}% Selesai</span> <span style="color:var(--brand);font-weight:850">Lanjutkan &rarr;</span>`;
        } else {
          footStatus = `<span>${overall.percent}% Tuntas</span> <span style="color:var(--brand);font-weight:850">Mulai Belajar &rarr;</span>`;
        }
      } else if (card.type === 'interactive_module' || (card.url && card.url !== '#' && !card.url.startsWith('javascript:'))) {
        targetHref = card.url;
        clickAttr = '';
        badgeLabel = card.badge || 'Modul Interaktif';
        if (statusInfo.status === 'completed') {
          footStatus = `<span style="color:var(--go);font-weight:850">Tuntas Dipelajari &bull; Buka Kembali &rarr;</span>`;
        } else if (statusInfo.status === 'progress') {
          footStatus = `<span style="color:#D97706;font-weight:850">Lanjutkan Belajar &rarr;</span>`;
        } else {
          footStatus = `<span style="color:var(--brand);font-weight:850">Buka Modul Belajar &rarr;</span>`;
        }
      } else if (card.videoUrl) {
        targetHref = '#';
        clickAttr = `onclick="openVideoModal('${encodeURIComponent(card.title)}', '${card.videoUrl}', '${card.id}'); return false;"`;
        if (statusInfo.status === 'completed') {
          footStatus = `<span style="color:var(--go);font-weight:850">Tuntas Ditonton &bull; Tonton Ulang &rarr;</span>`;
        } else {
          footStatus = `<span style="color:var(--brand);font-weight:800">Tonton Video Tutorial &rarr;</span>`;
        }
      } else {
        targetHref = '#';
        clickAttr = `onclick="alert('Materi ini sedang disiapkan.'); return false;"`;
        footStatus = `<span style="color:var(--muted)">Materi Tambahan</span>`;
      }

      return `
        <a href="${targetHref}" class="gallery-card" ${clickAttr}>
          <img src="${card.thumbnail || 'banner-2.jpg'}" alt="${card.title}" class="gallery-card-thumb">
          <div class="gallery-card-body">
            <div>
              <div class="card-badge-row">
                <span class="gallery-badge">${badgeLabel}</span>
                <span class="card-status-badge ${statusInfo.cssClass}">${statusInfo.label}</span>
              </div>
              <h4>${card.title}</h4>
              <p>${card.desc || ''}</p>
            </div>
            <div class="gallery-card-foot">
              ${footStatus}
            </div>
          </div>
        </a>
      `;
    }).join('');

    return `
      <section class="gallery-section">
        <div class="gallery-sec-head">
          <h3>${cat.categoryTitle}</h3>
          ${cat.categorySubtitle ? `<p>${cat.categorySubtitle}</p>` : ''}
        </div>
        <div class="gallery-grid">
          ${cardsHtml}
        </div>
      </section>
    `;
  }).join('');
}

function openModal7Day() {
  const modal = document.getElementById('modal7Day');
  const container = document.getElementById('modal7DayList');
  const progress = window.getLmsProgress ? window.getLmsProgress() : {};

  container.innerHTML = window.ASDOS_CURRICULUM.map(item => {
    const isDone = window.isDayCompleted ? window.isDayCompleted(item.day) : false;
    const arr = progress['day' + item.day] || [];
    const count = Array.isArray(arr) ? arr.filter(Boolean).length : 0;

    let statusPill = '';
    if (isDone) {
      statusPill = `
        <span style="font-size:13px;font-weight:800;color:var(--go);display:inline-flex;align-items:center;gap:4px">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Selesai</span>
        </span>
      `;
    } else if (count > 0) {
      statusPill = `<span style="font-size:13px;font-weight:800;color:var(--brand)">${count}/${item.steps}</span>`;
    } else {
      statusPill = `<span style="font-size:13px;font-weight:800;color:var(--muted)">Mulai &rarr;</span>`;
    }

    return `
      <a href="${item.url}" class="modal-lesson-item ${isDone ? 'done' : ''}">
        <div>
          <strong style="display:block;font-size:15px;color:var(--ink)">Day ${item.day} - ${item.title}</strong>
          <small style="color:var(--muted);font-size:13px">${item.desc}</small>
        </div>
        ${statusPill}
      </a>
    `;
  }).join('');

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

let currentPlayingVideoCardId = null;

function openVideoModal(titleEncoded, videoUrl, cardId) {

function updateVideoModalBtnState(cardId) {
  const btn = document.getElementById('btnToggleVideoComplete');
  const notice = document.getElementById('videoModalStatusNotice');
  if (!btn) return;

  if (!cardId) {
    btn.style.display = 'none';
    if (notice) notice.style.display = 'none';
    return;
  }
  btn.style.display = 'inline-block';
  if (notice) notice.style.display = 'block';

  const isComplete = localStorage.getItem('asdos_video_' + cardId + '_watched') === '1'
    || localStorage.getItem('asdos_module_completed_' + cardId) === 'true';

  if (isComplete) {
    if (notice) notice.innerHTML = '<span style="color:var(--go);font-weight:750">Status: Selesai</span>';
    btn.textContent = 'Batalkan Status Selesai';
    btn.style.background = '#F4EFE6';
    btn.style.color = 'var(--ink)';
    btn.style.border = '1px solid #DFCFC0';
  } else {
    if (notice) notice.innerHTML = '<span style="color:var(--muted)">Status: Belum Selesai</span>';
    btn.textContent = 'Tandai Selesai';
    btn.style.background = 'var(--go)';
    btn.style.color = '#fff';
    btn.style.border = 'none';
  }
}

function toggleCurrentVideoComplete() {
  if (!currentPlayingVideoCardId) return;
  const isComplete = localStorage.getItem('asdos_video_' + currentPlayingVideoCardId + '_watched') === '1'
    || localStorage.getItem('asdos_module_completed_' + currentPlayingVideoCardId) === 'true';

  if (isComplete) {
    localStorage.removeItem('asdos_video_' + currentPlayingVideoCardId + '_watched');
    localStorage.removeItem('asdos_module_completed_' + currentPlayingVideoCardId);
    window.showToast('Status materi diubah menjadi Belum Selesai.');

    playSuccessTone();
    window.showToast('Hebat! Modul ini telah ditandai Selesai.');
  }

  updateVideoModalBtnState(currentPlayingVideoCardId);
  if (typeof renderDashboard === 'function') {
    renderDashboard();
  }
}

function closeVideoModal() {
  const modal = document.getElementById('modalVideoPlayer');

// ==========================================================================
function copyPromptText(elementId) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const text = el.innerText || el.textContent;

  navigator.clipboard.writeText(text).then(() => {
    playSuccessTone();
    window.showToast('Teks prompt berhasil disalin ke clipboard!');
  }).catch(() => {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    window.showToast('Teks dipilih. Silakan ketuk Salin.');
  });
}

function escapeHtml(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ==========================================================================
// AUTH LOGIC (OTP & TRUSTED DEVICES 60 HARI)
// ==========================================================================
let authState = {
  step: 'email',
  email: '',
  timerInterval: null,
  countdownSeconds: 60
};

async function submitRequestOtp() {
  const input = document.getElementById('inputStudentEmail');
  const btn = document.getElementById('btnRequestOtp');
  const err = document.getElementById('authErrorMsgEmail');
  const email = (input ? input.value : '').trim();

  if (!email) return;

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>Mengirim kode OTP...</span>';
  }
  if (err) err.style.display = 'none';

  const res = await window.LMS_DB.requestStudentOtp(email);
  if (btn) {
    btn.disabled = false;
    btn.innerHTML = '<span>Kirim Kode OTP Masuk &rarr;</span>';
  }

  if (res.success) {
    authState.email = res.email;
    authState.step = 'otp';
    renderDashboard();
    startOtpCountdown();

    if (res.isDemo && res.demoOtp) {
      window.showToast('Kode OTP Percobaan: ' + res.demoOtp);
      const notice = document.getElementById('authNoticeOtp');
      if (notice) {
        notice.style.display = 'block';
        notice.textContent = res.message;
      }
    } else {
      window.showToast('Kode OTP 6-digit terkirim ke email Anda.');
    }
  } else {
    if (err) {
      err.textContent = res.message || 'Email belum terdaftar di whitelist Lynk.id.';
      err.style.display = 'block';
    }
  }
}

async function submitVerifyOtp() {
  const input = document.getElementById('inputOtpCode');
  const btn = document.getElementById('btnVerifyOtp');
  const err = document.getElementById('authErrorMsgOtp');
  const checkTrust = document.getElementById('checkTrustDevice');
  const token = (input ? input.value : '').trim();

  if (!token) return;

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>Memverifikasi kode...</span>';
  }
  if (err) err.style.display = 'none';

  const trustDevice = checkTrust ? checkTrust.checked : true;
  const res = await window.LMS_DB.verifyStudentOtp(authState.email, token, trustDevice);
  if (btn) {
    btn.disabled = false;
    btn.innerHTML = '<span>Verifikasi & Buka Kelas &rarr;</span>';
  }

  if (res.success) {
    clearInterval(authState.timerInterval);
    playSuccessTone();

    // Jika member belum pernah atur nama/username publik, arahkan ke onboarding setup username
    if (!res.student.hasSetUsername) {
      authState.step = 'setup_username';
      renderDashboard();
      return;
    }

    window.showToast('Selamat datang, ' + (res.student.username || res.student.name) + '!');
    if (res.deviceNotice) {
      setTimeout(() => {
        window.showToast(res.deviceNotice);
      }, 2200);
    }
    renderDashboard();
  } else {
    if (err) {
      err.textContent = res.message || 'Kode OTP salah atau telah kadaluarsa.';
      err.style.display = 'block';
    }
  }
}

async function submitSaveUsername() {
  const input = document.getElementById('inputOnboardingUsername');
  const btn = document.getElementById('btnSaveUsername');
  const err = document.getElementById('onboardingUsernameError');
  const val = (input ? input.value : '').trim();

  if (!val) {
    if (err) {
      err.textContent = 'Silakan masukkan nama atau username Anda.';
      err.style.display = 'block';
    }
    return;
  }

  if (val.length < 2) {
    if (err) {
      err.textContent = 'Nama minimal 2 karakter.';
      err.style.display = 'block';
    }
    return;
  }

  const student = window.LMS_DB.getCurrentStudent();
  const email = student ? student.email : authState.email;

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>Menyimpan nama...</span>';
  }
  if (err) err.style.display = 'none';

  const res = await window.LMS_DB.saveStudentUsername(email, val);
  if (btn) {
    btn.disabled = false;
    btn.innerHTML = '<span>Simpan & Masuk ke Ruang Belajar &rarr;</span>';
  }

  if (res.success) {
    authState.step = 'dashboard';
    playSuccessTone();
    window.showToast('Selamat datang di Akademi Asdos, ' + res.username + '!');
    renderDashboard();
  } else {
    if (err) {
      err.textContent = res.message || 'Gagal menyimpan nama. Coba lagi.';
      err.style.display = 'block';
    }
  }
}

function openEditUsernameModal() {
  const student = window.LMS_DB.getCurrentStudent();
  const modal = document.getElementById('modalEditUsername');
  const input = document.getElementById('modalInputUsername');
  const err = document.getElementById('modalUsernameError');
  if (err) err.style.display = 'none';
  if (input && student) {
    input.value = student.username || student.name || '';
  }
  if (modal) {
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => { if (input) input.focus(); }, 100);
  }
}

function closeEditUsernameModal() {
  const modal = document.getElementById('modalEditUsername');
  if (modal) modal.classList.remove('open');
  document.body.style.overflow = '';
}

async function submitUpdateUsernameModal() {
  const input = document.getElementById('modalInputUsername');
  const btn = document.getElementById('btnSaveUsernameModal');
  const err = document.getElementById('modalUsernameError');
  const val = (input ? input.value : '').trim();

  if (!val || val.length < 2) {
    if (err) {
      err.textContent = 'Nama minimal 2 karakter.';
      err.style.display = 'block';
    }
    return;
  }

  const student = window.LMS_DB.getCurrentStudent();
  if (!student) return;

  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';
  }
  if (err) err.style.display = 'none';

  const res = await window.LMS_DB.saveStudentUsername(student.email, val);
  if (btn) {
    btn.disabled = false;
    btn.textContent = 'Simpan Perubahan';
  }

  if (res.success) {
    closeEditUsernameModal();
    playSuccessTone();
    window.showToast('Nama publik berhasil diperbarui: ' + res.username);
    renderDashboard();
  } else {
    if (err) {
      err.textContent = res.message || 'Gagal menyimpan perubahan.';
      err.style.display = 'block';
    }
  }
}

function startOtpCountdown() {
  clearInterval(authState.timerInterval);
  authState.countdownSeconds = 60;
  const btn = document.getElementById('btnResendOtp');
  const cd = document.getElementById('resendCountdown');
  if (btn) btn.disabled = true;

  authState.timerInterval = setInterval(() => {
    authState.countdownSeconds--;
    if (cd) cd.textContent = authState.countdownSeconds;
    if (authState.countdownSeconds <= 0) {
      clearInterval(authState.timerInterval);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = 'Kirim Ulang Kode';
      }
    }
  }, 1000);
}

async function resendOtp() {
  if (!authState.email) return;
  const btn = document.getElementById('btnResendOtp');
  if (btn) btn.disabled = true;
  window.showToast('Mengirim ulang kode OTP...');

  const res = await window.LMS_DB.requestStudentOtp(authState.email);
  if (res.success) {
    startOtpCountdown();
    window.showToast('Kode OTP baru telah dikirim.');
    if (res.isDemo && res.demoOtp) {
      const notice = document.getElementById('authNoticeOtp');
      if (notice) {
        notice.style.display = 'block';
        notice.textContent = res.message;
      }
    }
  } else {
    window.showToast(res.message || 'Gagal mengirim ulang kode.');
    if (btn) btn.disabled = false;
  }
}

function switchBackToEmail() {
  clearInterval(authState.timerInterval);
  authState.step = 'email';
  renderDashboard();
}

async function doLogout() {
  if (confirm('Keluar dari ruang belajar? Sesi perangkat ini akan dinonaktifkan.')) {
    await window.LMS_DB.logoutStudent();
    window.showToast('Anda telah keluar dari akun.');
    authState.step = 'email';
    renderDashboard();
  }
}

// Close modals when clicking backdrop
window.addEventListener('click', (e) => {
  if (e.target.classList.contains('modal-backdrop')) {
    closeModal7Day();
    closeVideoModal();
    closeEditUsernameModal();
  }
});

document.addEventListener('DOMContentLoaded', async () => {
  // Silent auto-login via Trusted Device token di Supabase
  if (window.LMS_DB && window.LMS_DB.checkTrustedDeviceSession) {
    const sessionRes = await window.LMS_DB.checkTrustedDeviceSession();
    if (sessionRes && sessionRes.kicked) {
      window.showToast(sessionRes.message);
    }
  }
  renderDashboard();
});
</script>
</body>
